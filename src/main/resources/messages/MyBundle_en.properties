# Plugin information
Upcaser.Name=Upcaser
Upcaser.Description=Automatically capitalize letters after sentence-ending punctuation marks in any text file. Supports periods, exclamation marks, question marks, and ellipsis with customizable shortcuts.
# Settings
Settings.Title=Upcaser Settings
Settings.Enabled=Enable Upcaser
Settings.Description=Enable automatic capitalization after punctuation marks. Use Ctrl+Shift+X to toggle quickly.
Settings.PunctuationMarks=Punctuation Marks
Settings.Period=Capitalize after period (.)
Settings.Exclamation=Capitalize after exclamation mark (!)
Settings.Question=Capitalize after question mark (?)
Settings.Ellipsis=Capitalize after ellipsis (...)
Settings.MarkdownHeader=Capitalize after Markdown header (#)
Settings.MarkdownList=Capitalize after Markdown list (-, *, +, 1., ...)
Settings.MarkdownList.Description=Capitalise the first letter after Markdown list markers such as -, *, +, 1., 2., etc. Supports indented sub-lists.
Settings.AutoSpace=Auto Space
Settings.AutoAddSpace=Automatically add space after punctuation marks
Settings.AutoAddSpace.Description=When enabled, a space will be automatically added after typing punctuation marks
Settings.TextBoxes=IDE Text Boxes
Settings.EnableInTextBoxes=Capitalize in IDE text boxes
Settings.EnableInTextBoxes.Description=Capitalize the first letter of sentences in the multi-line text boxes of the IDE, such as the commit message, the chat input or the description fields. Text boxes rendered inside a browser, like the pull request forms of the GitHub and GitLab plugins, are not supported.
Settings.StatusBar=Status Bar
Settings.ShowInStatusBar=Show in status bar
