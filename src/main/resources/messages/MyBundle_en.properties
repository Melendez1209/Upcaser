Settings.Shortcut.Label=Toggle shortcut:
Settings.Shortcut.Upcase.Label=Capitalise selection shortcut:
Settings.Shortcut.Description=Click on the text field and press your desired key combination to set a custom shortcut
Settings.Shortcut.Reset=Reset to Default
Settings.Shortcut.Clear=Clear
Settings.Shortcut.Tooltip=Click and press keys to set shortcut
Settings.Shortcut.Capturing=Press keys for shortcut...
Settings.Shortcut.Empty=Shortcut cannot be empty
Settings.Shortcut.Invalid=Invalid shortcut combination
